spring:
  application:
    name: ZeroSum

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zerosum}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  flyway:
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:}}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:}
    trust-render-client-ip: ${APP_TRUST_RENDER_CLIENT_IP:false}
