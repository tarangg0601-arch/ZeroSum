spring:
  application:
    name: ZeroSum

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zerosum}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  flyway:
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:}}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:}
    trust-render-client-ip: ${APP_TRUST_RENDER_CLIENT_IP:false}
    email:
      from: ${EMAIL_FROM:}
      public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
