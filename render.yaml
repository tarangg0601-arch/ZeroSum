services:
  - type: web
    name: zerosum-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FLYWAY_DB_USERNAME
        sync: false
      - key: FLYWAY_DB_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://zerosum-frontend.onrender.com
      - key: APP_AUTH_TOKEN_SECRET
        sync: false
      - key: APP_TRUST_RENDER_CLIENT_IP
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTH
        value: "true"
      - key: EMAIL_FROM
        sync: false
      - key: APP_PUBLIC_BASE_URL
        value: https://zerosum-frontend.onrender.com
  - type: web
    name: zerosum-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://zerosum-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
