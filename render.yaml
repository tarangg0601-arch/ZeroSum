services:
  - type: web
    name: zerosum-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FLYWAY_DB_USERNAME
        sync: false
      - key: FLYWAY_DB_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://zerosum-frontend.onrender.com
      - key: APP_AUTH_TOKEN_SECRET
        sync: false
      - key: APP_TRUST_RENDER_CLIENT_IP
        value: "true"
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: APP_PUBLIC_BASE_URL
        value: https://zerosum-frontend.onrender.com
  - type: web
    name: zerosum-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://zerosum-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
    envVars:
      - key: VITE_API_BASE_URL
        value: https://zerosum-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
